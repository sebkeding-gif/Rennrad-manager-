<head>

<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Kettenblatt-Cup</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>
<style>
/* Layout: Rennen als Vollbild-Draufsicht, Menüs (Werkstatt, Radladen, Ergebnis) als Overlay im Stil alter DOS-Rennspiele. Eine feste, düstere Rost-und-Stahl-Optik. */
:root{
  --steel:#16171a; --plate:#24262b; --rivet:#3a3d44; --rust:#e0662a; --hazard:#f2c230; --bone:#ece4d2; --dim:#9a9488; --ok:#7fc77a; --bad:#e2483d;
  --display:"Black Ops One",Impact,"Arial Black",sans-serif;
  --ui:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--steel);color:var(--bone);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
@media (orientation:portrait){#stage{flex:0 0 auto;height:min(100vw,62vh)}}
canvas{display:block}
#cv{width:100%;height:100%}
#pad{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 16px;background:var(--steel)}
.grp{display:flex;gap:10px;align-items:center}
.grp.steer{gap:18px;padding:14px;margin:-14px;touch-action:none}
.btn.arrow{width:80px;height:80px}
@media (pointer:coarse) and (min-width:700px){
  .grp.steer{gap:22px;padding:24px;margin:-24px}
  .btn.arrow{width:124px;height:124px;font-size:2.6rem;border-width:3px}
  .btn.fire{width:124px;height:124px;font-size:1.15rem;border-width:3px}
  .btn.small{width:84px;height:84px;font-size:.95rem}
  .stack{gap:12px}
  #pad{padding-inline:28px}
}
@media (orientation:landscape) and (pointer:coarse){#pad{padding-bottom:calc(max(12px,16vh - 50px) + env(safe-area-inset-bottom,0px))}}
@media (orientation:portrait) and (pointer:coarse){#pad{align-items:flex-start;padding-top:62px}}
.btn{width:70px;height:70px;border-radius:50%;border:2px solid rgba(236,228,210,.25);background:rgba(36,38,43,.85);color:var(--bone);font:700 .95rem var(--ui);letter-spacing:.05em;text-transform:uppercase;display:grid;place-items:center;touch-action:none;padding:0}
.btn.arrow{font-size:1.6rem}
.btn.fire{width:84px;height:84px;border-color:var(--rust);color:var(--rust)}
.btn.small{width:56px;height:56px;font-size:.8rem}
.btn.on{background:rgba(224,102,42,.35);border-color:var(--hazard)}
.stack{display:flex;flex-direction:column;gap:8px}
@media (orientation:landscape){#pad{position:absolute;left:0;right:0;bottom:0;background:transparent;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (hover:hover) and (pointer:fine){#pad{display:none}}

#overlay{position:fixed;inset:0;z-index:5;overflow:auto;background:radial-gradient(ellipse at 50% 0%,rgba(224,102,42,.18),transparent 60%),linear-gradient(180deg,rgba(12,12,14,.55),rgba(12,12,14,.82));padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#panel{max-width:64rem;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#overlay.center{display:grid;place-items:center}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--rust);line-height:1;text-wrap:balance;text-shadow:0 3px 0 #000}
h2{font-size:1.15rem;color:var(--hazard);text-transform:uppercase}
h3{font-size:1.1rem;color:var(--bone)}
p{margin:0;line-height:1.4;font-size:1.1rem;max-width:38rem}
.hint{color:var(--dim);font-size:1rem}
.title{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-block:24px}
.title .tag{font:700 .95rem var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{font:400 1.05rem var(--display);color:var(--steel);background:var(--rust);border:0;border-radius:4px;padding:.7em 1.5em;cursor:pointer;box-shadow:0 3px 0 #000}
.go.alt{background:var(--plate);color:var(--bone);border:1px solid var(--rivet)}
.go:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--hazard);outline-offset:3px}

.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--rivet);padding-bottom:10px}
.g-stats{display:flex;gap:18px;font-size:1.15rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.g-stats b{color:var(--hazard);font-weight:700}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:14px;align-items:start}
.card{background:linear-gradient(180deg,#2a2c31,#202226);border:1px solid var(--rivet);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card::before,.card::after{content:"";position:absolute;top:7px;width:5px;height:5px;border-radius:50%;background:var(--rivet)}
.card::before{left:7px}.card::after{right:7px}
.card.mine{border-color:var(--hazard)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding-block:6px;border-top:1px solid rgba(236,228,210,.08)}
.item .nm{font-weight:700;font-size:1.05rem}
.ds{color:var(--dim);font-size:.92rem}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.pips i{width:10px;height:6px;background:var(--rivet);display:block}
.pips i.on{background:var(--rust)}
.buy{grid-row:span 2;font:700 .95rem var(--ui);color:var(--bone);background:var(--rivet);border:1px solid #4c5059;border-radius:4px;padding:.45em .8em;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy:hover:not(:disabled){background:var(--rust);color:var(--steel)}
.buy:disabled{opacity:.4;cursor:not-allowed}
.hp{height:12px;background:#111;border:1px solid var(--rivet);position:relative;grid-column:1/-1}
.hp span{position:absolute;inset:0 auto 0 0;background:var(--ok)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.02rem}
td{padding:4px 4px;border-top:1px solid rgba(236,228,210,.08)}
td:last-child{text-align:right}
tr.me td{color:var(--hazard)}
.scene{display:block;width:100%;aspect-ratio:8/3;max-width:100%;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,154,74,.2)}
.scene.sq{width:110px;aspect-ratio:1;flex:none}
.title canvas.hero[data-scene="podest"]{width:min(100%,46rem)}
.hero-wrap{position:relative;width:min(100%,46rem);display:flex;flex-direction:column;align-items:center;gap:8px}
canvas.hero{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 0 1px rgba(255,154,74,.25)}
.hero-wrap .stripe{position:absolute;top:12px;left:50%;transform:translateX(-50%) rotate(-1.5deg);white-space:nowrap}
.hero-wrap .logo{margin-top:-.75em!important;position:relative;z-index:1}
.namef{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:.95rem;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.namef input{font:700 1.15rem var(--ui);text-align:center;color:var(--bone);background:#0f1012;border:1px solid var(--rivet);border-radius:4px;padding:.45em .8em;width:min(18rem,80vw);text-transform:none;letter-spacing:0}
.namef input:focus{outline:2px solid var(--hazard);outline-offset:2px}
#panel.enter>*{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
#panel.enter>*:nth-child(2){animation-delay:.06s}#panel.enter>*:nth-child(3){animation-delay:.12s}#panel.enter>*:nth-child(4){animation-delay:.18s}#panel.enter>*:nth-child(5){animation-delay:.24s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}70%{transform:scale(1.04) rotate(-1deg)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#panel.enter>*,.paper .hl{animation:none!important}}
canvas.face{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid rgba(0,0,0,.6);background:#111;max-width:100%}
canvas.face.sm{width:64px;flex:none}
.grid-line{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:12px}
.rider{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:linear-gradient(180deg,#2a2c31,#1e2024);border:1px solid var(--rivet);border-radius:6px;padding:8px;position:relative;min-width:0}
.rider.me{border-color:var(--hazard)}.rider.mad{border-color:var(--bad)}
.rider b{font-size:1.05rem}
.rider .grudge{position:absolute;top:6px;right:6px}
.grudge{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--bad);padding:1px 5px;border-radius:2px;margin-left:.4em}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bubble{display:flex;gap:12px;align-items:center;background:#1b1c20;border:1px solid var(--rivet);border-radius:8px;padding:10px 12px}
.bubble.mad{border-color:var(--bad)}
.bubble p{font-size:1.1rem;min-width:0}
.spon{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:#1b1c20;border:1px solid var(--rivet);border-left:5px solid var(--c);border-radius:4px;padding:8px 12px;color:var(--bone);font:500 .98rem var(--ui);cursor:pointer}
.spon .logo-s{font:400 1rem var(--display);color:var(--c);grid-column:1/-1}
.spon b{color:var(--ok);font-variant-numeric:tabular-nums}
.spon.on{background:#24262b;border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.spon .sig{grid-column:1/-1;font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--c)}
.sharkrow{display:flex;gap:12px;align-items:flex-start}
.sharkrow p{font-size:1rem;min-width:0}
.row.left{justify-content:flex-start}
.card.shark{border-color:#5a2a24}
.paper{--ink:#1d1b17;background:#efe7d4 radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%);color:var(--ink);border-radius:2px;padding:18px clamp(14px,3vw,30px) 22px;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:rotate(-.6deg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;gap:10px}
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;border-bottom:3px double var(--ink);padding-bottom:6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.mast span:last-child{text-align:right}
.mast b{font:400 clamp(1.6rem,5.5vw,2.8rem)/1 "UnifrakturMaguntia",Georgia,serif;letter-spacing:0;text-transform:none;text-align:center}
.paper .hl{font:900 clamp(1.7rem,5.4vw,3rem)/1.02 "Playfair Display",Georgia,serif;margin:6px 0 0;color:var(--ink);text-shadow:none;text-wrap:balance;animation:pop .55s .15s cubic-bezier(.2,.8,.2,1) both}
.paper .sub{font:italic 400 clamp(1.05rem,2.4vw,1.3rem)/1.3 "Playfair Display",Georgia,serif;max-width:none;border-bottom:1px solid rgba(29,27,23,.4);padding-bottom:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:10px;min-width:0}
.story .pic{width:min(10rem,40%);float:left;filter:grayscale(1) contrast(1.15) sepia(.25);border:1px solid var(--ink);margin:0 12px 6px 0;border-radius:0}
.story .lede{display:block;font-size:1.06rem;line-height:1.5;max-width:none;text-align:justify;hyphens:auto}
.story .lede::first-letter{font:900 2.6em/0.8 "Playfair Display",Georgia,serif;float:left;margin:4px 6px 0 0}
.story .side{font-size:.95rem;font-style:italic;max-width:none;clear:both}
.paper aside{border-left:1px solid rgba(29,27,23,.4);padding-left:14px;min-width:0}
@media (max-width:640px){.paper aside{border-left:0;padding-left:0;border-top:1px solid rgba(29,27,23,.4);padding-top:10px}}
.paper aside h3{font:700 1rem "Playfair Display",Georgia,serif;color:var(--ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.paper table{font-size:.95rem}
.paper td{border-top:1px dotted rgba(29,27,23,.35)}
.paper tr.me td{background:rgba(242,194,48,.35);color:var(--ink)}
.paper .rk{font-family:"Playfair Display",Georgia,serif;font-weight:900;color:var(--ink)!important}
.offer .rec{font-size:.88rem;color:var(--hazard);font-variant-numeric:tabular-nums}
h3.mini{display:flex;align-items:center;font:700 1rem var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--bone);margin-top:4px}
.pq{margin:4px 0 0;padding:8px 0 8px 14px;border-left:4px solid var(--ink);font:italic 700 1.2rem/1.3 "Playfair Display",Georgia,serif;clear:both}
.pq cite{display:block;font:400 .85rem Georgia,serif;font-style:normal;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.pq cite::before{content:"– "}
.paper aside h3+table,.paper aside h3+p{margin-bottom:8px}
.paper aside h3{margin-top:8px}
.recl{font-size:.95rem;font-variant-numeric:tabular-nums;max-width:none}
.neu{background:#d22;color:#fff;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;font-family:var(--ui)}
.xpbar{height:10px;background:#111;border:1px solid var(--rivet)}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#c9541c,#f2c230)}
.ok{color:var(--ok)}
.xpline{font-size:1rem;color:var(--hazard)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:6px}
.ach{display:flex;flex-direction:column;gap:2px;background:#16171a;border:1px solid var(--rivet);border-radius:4px;padding:6px 8px;opacity:.45;font-size:.85rem;min-width:0}
.ach.on{opacity:1;border-color:var(--hazard);background:linear-gradient(180deg,#2c2610,#1b1a14)}
.ach b{font-size:.95rem;color:var(--bone)}.ach span{color:var(--dim)}.ach em{font-style:normal;color:var(--ok);font-weight:700}
.achnew{display:grid;gap:6px;margin-top:6px}
.paper .ach{color:var(--bone)}
.jbtn{display:inline-flex;align-items:center;gap:2px;font:700 .9rem var(--ui);color:var(--bone);background:#1b1c20;border:1px solid var(--rivet);border-radius:4px;padding:4px 8px;cursor:pointer}
.jbtn.on{border-color:var(--hazard);box-shadow:0 0 0 1px var(--hazard) inset}
.chip.patron{background:var(--hazard);color:#111;font-weight:700}
.weekly{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;background:#1b1c20;border:1px solid var(--rivet);border-left:5px solid var(--hazard);border-radius:4px;padding:10px 14px;max-width:38rem}
.weekly b{font-family:var(--display);font-weight:400;color:var(--hazard)}
.weekly span{color:var(--dim)}
.link{background:none;border:0;color:var(--dim);font:500 .95rem var(--ui);text-decoration:underline;cursor:pointer;padding:4px}
textarea.code{width:100%;min-height:7rem;font:12px/1.3 ui-monospace,Menlo,monospace;background:#0f1012;color:var(--bone);border:1px solid var(--rivet);border-radius:4px;padding:8px;word-break:break-all;resize:vertical}
.lock{font-weight:700;color:var(--dim);border:1px dashed var(--rivet);padding:.35em .7em;border-radius:4px}
.card.topbike{border-color:#8a6a2a;background:linear-gradient(180deg,#30291a,#1f1c16)}
.toptag{font:700 .7rem var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#111;background:var(--hazard);padding:1px 6px;border-radius:2px;vertical-align:.25em}
.card.bill{max-width:30rem;width:100%;align-self:center}
body.menu #pad{visibility:hidden}
table td:last-child{white-space:nowrap}
.jer{width:1.35em;height:1.25em;vertical-align:-.28em;margin-right:.45em;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.jer.big{width:2.4em;height:2.2em}
.stand td,.card table td{padding-block:5px}
.rk{width:1.8em;font-family:var(--display);color:var(--dim);text-align:center}
tr.pod.p1 .rk{color:#f2c230}tr.pod.p2 .rk{color:#cfd3d8}tr.pod.p3 .rk{color:#d08a4a}
tr.me td{background:rgba(242,194,48,.08)}
.lead{margin-left:.5em;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#111;background:var(--hazard);padding:1px 5px;border-radius:2px}
.chip{background:rgba(0,0,0,.45);border:1px solid var(--rivet);border-radius:3px;padding:3px 10px}
.chip.cash b{color:var(--ok)}
.stripe{background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#111 10px 20px);color:#111!important;padding:4px 14px;font-weight:700;text-shadow:0 0 6px var(--hazard),0 0 2px var(--hazard)}
.logo{font-size:clamp(2.6rem,10vw,4.8rem)!important;background:linear-gradient(180deg,#ffb36b 0%,#e0662a 55%,#8a2f10 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 18px rgba(224,102,42,.35))}
.g-head{position:relative;border-bottom:0!important;padding-bottom:16px!important}
.g-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#111 10px 20px);opacity:.85}
.card{box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card h2{display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:1em;background:var(--rust)}
.offer{display:grid!important;grid-template-columns:86px 1fr;gap:6px 12px;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .12s,border-color .12s}
.offer:hover{transform:translateY(-2px)}
.offer .thumb{width:86px;height:86px;grid-row:span 2;border-radius:3px;border:1px solid rgba(0,0,0,.6)}
.offer .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.offer .diff{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.offer .money{color:var(--bone);font-weight:700}
.offer .field{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.92rem;padding-top:6px;border-top:1px solid rgba(236,228,210,.08)}
.offer .riv{display:inline-flex;align-items:center;white-space:nowrap}
.go{background:linear-gradient(180deg,#f08a4a,#c9541c)!important}
.go.alt{background:linear-gradient(180deg,#30333a,#24262b)!important}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em;vertical-align:-.03em;border:1px solid rgba(0,0,0,.5)}
.typ{font-size:.8rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-left:.3em}
.offer{text-align:left;display:flex;flex-direction:column;gap:4px;background:#1b1c20;border:1px solid var(--rivet);border-left:5px solid var(--c);border-radius:4px;padding:10px 12px;color:var(--bone);font:500 1rem var(--ui);cursor:pointer}
.offer:hover{border-color:var(--c)}
.offer .t{font:400 1.05rem var(--display);color:var(--c)}
.offer .m{color:var(--dim);font-size:.92rem;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#2c2e34;border:1px solid var(--rivet);padding:1px 6px;border-radius:3px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.sum .tot{color:var(--hazard);font-weight:700;border-top:1px solid var(--rivet);padding-top:4px}
.warn{color:var(--bad)}
.bikeview{width:100%;max-width:260px;aspect-ratio:16/9;align-self:center;background:radial-gradient(ellipse at 50% 80%,rgba(224,102,42,.12),transparent 70%)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:.95rem}
.bar{height:7px;background:#111;border:1px solid var(--rivet)}
.bar i{display:block;height:100%;background:var(--rust)}
.price{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

    if(!race.demo&&!npc(r)&&race.rec&&r.time<race.rec.race){race.rec.race=r.time;race.rec.rn=r.isP?pname():r.name;race.rec.rnP=!!r.isP;if(r.isP){race.newRec.race=true;setTimeout(()=>flash('Streckenrekord!',2.2),900)}}}

function update(dt){
  msgT-=dt;shake=Math.max(0,shake-dt);
  if(!race)return;
  for(const p of race.pickups){p.cd-=dt;p.ph+=dt}
  for(const f of race.tk.fans)f.ph+=dt*(4+((f.x*7)%3));
  for(const p of race.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}
  race.parts=race.parts.filter(p=>p.life>0);
  for(const l of race.litter)l.life-=dt;
  race.litter=race.litter.filter(l=>l.life>0);
  if(state==='count'){
    stT-=dt;const n=Math.ceil(stT-.2);
    if(n!==lastBeep&&n>=0){lastBeep=n;sfx(n>0?440:880,n>0?440:880,.15,'square',.05)}
    if(stT<=.2){state='race';flash('Los!',.8)}
    return;
  }
  if(state!=='race'&&!(race.demo&&state==='menu'))return;
  race.t+=dt;
  for(const r of race.racers)stepRacer(r,dt);
  const rs=race.racers;
  for(const r of rs){r.bumpT=(r.bumpT||0)-dt;r.push=(r.push||0)*Math.max(0,1-dt*1.5)}
  for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
    const a=rs[i],b=rs[j];if(a.wrecked||b.wrecked)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<11&&d>.01){
      // seitlich auseinanderdrücken statt verkeilen
      const pa=race.tk.pts[a.idx],side=(dx*pa.nx+dy*pa.ny)>=0?1:-1,p=(11-d)/2+.6;
      a.x-=pa.nx*side*p;a.y-=pa.ny*side*p;b.x+=pa.nx*side*p;b.y+=pa.ny*side*p;
      a.push=(a.push||0)-side*14;b.push=(b.push||0)+side*14;
      if(!(a.bumpT>0)&&!(b.bumpT>0)){a.bumpT=b.bumpT=.7;
        const rel=Math.abs(a.v-b.v);if(rel>25&&!friend(a,b)){damage(a,1.5,b);damage(b,1.5,a)}
        if(a.prog<b.prog)a.v*=.94;else b.v*=.94;
        if((a.isP||b.isP)&&!race.demo)sfx(160,90,.06,'square',.03)}}
  }
  for(const s of race.shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;s.rot+=dt*16;
    for(const r of rs){if(r===s.own||r.wrecked||s.life<=0||friend(r,s.own))continue;
      if((r.x-s.x)**2+(r.y-s.y)**2<100){s.life=-1;damage(r,4,s.own);burst(s.x,s.y,'#9fe0f5',8,70,.4);r.v*=.97;if(s.own.isP)sfx(1000,700,.04,'square',.02)}}
    if(s.life<=0&&s.life>-1&&race.litter.length<80)race.litter.push({x:s.x,y:s.y,a:s.rot,col:s.col,life:6});
  }
  race.shots=race.shots.filter(s=>s.life>0);
  for(const k of race.tacks){
    k.age+=dt;k.life-=dt;
    for(const r of rs){if(r.wrecked||k.life<=0||(r===k.own&&k.age<1.5)||friend(r,k.own))continue;
      if((r.x-k.x)**2+(r.y-k.y)**2<130){k.life=0;r.flat=1.6;if(r.isP&&!race.demo)race.flats++;damage(r,12,k.own);if(r.isP){flash('Platten!');sfx(1500,100,.4,'sawtooth',.04)}}}
  }
  race.tacks=race.tacks.filter(k=>k.life>0);
  if(race.demo)return;
  if(!race.endT&&!race.solo&&rs.filter(r=>!r.isP&&!npc(r)).every(r=>r.wrecked)){flash('Alle Gegner gestürzt!',2);race.endT=2.5}
  if(race.endT){race.endT-=dt;if(race.endT<=0)finishRace()}
}

function finishRace(){
  state='menu';
  const {N}=race.tk,laps=race.laps,rs=race.racers.filter(r=>!npc(r));
  const done=rs.filter(r=>r.done).sort((a,b)=>a.time-b.time);
  const run=rs.filter(r=>!r.done&&!r.wrecked);
  run.forEach(r=>{r.time=race.t+(laps*N-r.prog)*SP/(r.vmax*.9)});
  run.sort((a,b)=>a.time-b.time);
  let order=[...done,...run,...rs.filter(r=>r.wrecked)].map(r=>({name:r.name,col:r.col,isP:r.isP,typ:r.typ,wrecked:r.wrecked,time:r.time}));
  if(race.solo){for(const i of race.offer.riv){const rv=RIVALS[i];order.push({name:rv.n,col:rv.c,isP:false,typ:rv.t,wrecked:false,time:N*SP*laps/((148+race.d*16+rv.sk*18+(rv.t==='K'?8:0))*.84)*(1+(rnd()-.5)*.08)})}
    order.sort((a,b)=>(a.wrecked-b.wrecked)||a.time-b.time)}
  const res=order.map((r,i)=>({...r,pts:r.wrecked?0:PTS[race.d][i],prize:r.wrecked?0:Math.round(PRIZE[i]*MULT[race.d]*race.spm)}));
  const me=res.find(r=>r.isP);
  if(race.rec&&(race.rec.race<race.rec0.race||race.rec.lap<race.rec0.lap))saveRec(race.offer.th,race.rec);
  if(race.duel)return duelDone(res,me);
  if(race.weekly)return weeklyDone(res,me);
  for(const r of res)S.points[r.name]=(S.points[r.name]||0)+r.pts;
  const inRace=new Set(res.map(r=>r.name));
  for(const rv of RIVALS)if(!inRace.has(rv.n))S.points[rv.n]+=Math.max(0,Math.round(rnd()*(2+rv.sk*7)-1));
  const place=res.indexOf(me)+1,sp=race.sponsor;
  const spOk=sp?sp.ok({kills:race.kills,wrecked:me.wrecked,flats:race.flats,place,hp:player.hp/player.maxHp}):false;
  const spPay=spOk?sp.pay:0;
  const wWins=(race.wwin.spr.Du||0)+(race.wwin.kom.Du||0),wPay=wWins*WBON[race.d];
  const recPay=(race.newRec.race?REC_BONUS.race:0)+(race.newRec.lap?REC_BONUS.lap:0);
  for(const tp of ['kom','spr'])for(const [n,pt] of Object.entries(race.wpts[tp]))S[tp][n]=(S[tp][n]||0)+pt;
  const matePay=C.mate?MATE_PAY[race.d]:0;
  const total=me.prize+race.earn.bounty+race.earn.pick+spPay+wPay+recPay-matePay;
  // Erfahrung
  let xp=me.wrecked?15:40+[100,70,50,35,20,10][place-1];xp+=race.kills*15+wWins*20+(recPay?40:0);
  C.xp+=xp;let lvlUp=0;while(C.xp>=xpNeed(C.lvl)){C.xp-=xpNeed(C.lvl);C.lvl++;C.spts++;lvlUp++}
  // Erfolge
  const newAch=[];const win=place===1&&!me.wrecked;
  if(!me.wrecked)C.tracks[race.offer.th]=1;if(me.wrecked)S.crashes=(S.crashes||0)+1;
  if(win)grant('sieg1',newAch);
  if(race.kills>=5)grant('killer',newAch);
  if(win&&race.offer.th===3&&race.flats===0)grant('roubaix',newAch);
  if(race.newRec.race||race.newRec.lap)grant('rekord',newAch);
  if(Object.keys(C.tracks).length>=THEMES.length)grant('welt',newAch);
  if(win&&race.thrown===0&&!race.solo)grant('pazifist',newAch);
  if(win&&race.special==='klassiker')grant('klassiker',newAch);
  if(win&&race.special==='nacht')grant('nacht',newAch);
  if(win&&race.special==='ezf')grant('ezf',newAch);
  if(C.lvl>=5)grant('stufe5',newAch);
  for(const n of Object.keys(S.grudge))if(rs.some(r=>r.name===n))S.grudge[n]--;
  for(const w of race.wrecks)if(w.by==='Du'&&!w.thug&&w.v!==MATE)S.grudge[w.v]=2;
  let interest=0;if(overdue()){interest=Math.round(S.debt*.1);S.debt+=interest}
  race.summary={place,spOk,spPay,sp,interest,wWins,wPay,recPay,matePay,xp,lvlUp,newAch,thug:race.racers.some(r=>r.thug),thugDown:race.wrecks.some(w=>w.thug)};
  {const sf=race.tk.surf,rough=sf.filter(x=>x==='cobbles'||x==='gravel').length/sf.length,w=S.wear||(S.wear=WEAR0()),crash=me.wrecked?1:0,lp=race.laps/3;
    const add={reifen:(8+rough*14+race.flats*4)*lp,kette:9*lp,rad:(5+rough*10)*lp+crash*12,schalt:6*lp+crash*10};
    race.summary.wearAdd={};for(const k in add){const v=Math.round(add[k]);w[k]=Math.min(100,(w[k]||0)+v);race.summary.wearAdd[k]=v}}
  S.money+=total;S.hp=Math.max(0,Math.round(player.hp));const kp=race.keep||player;S.ammo=kp.ammo;S.tacks=kp.tacks;S.gels=kp.gels;
  const raceNo=S.race;S.race++;
  if(S.race<=RACES)makeOffers();
  save();
  showResults(res,me,total,raceNo);
}

function headline(res,me,sm,tName,at){
  const N=pname(),win=res[0],m2=res[1],rivs=res.filter(r=>!r.isP).map(r=>r.name),kills=race.kills;
  const myW=race.wrecks.find(w=>w.v==='Du'),margin=(!win.wrecked&&m2&&!m2.wrecked)?m2.time-win.time:99;
  const patron=rivs.includes('Der Patron'),W=win.isP?N:win.name;
  let h,sub;

  else if(myW){h=pick([`${N} küsst den Asphalt!`,`Bruchlandung! ${N} parkt den Hintern im Straßengraben`,`Rumms! ${N} legt sich lang ${at}`,`${N} macht den Abflug – Hose kaputt, Ego auch`]);sub=pick([`Sanitäter ziehen Kies aus Stellen, über die man nicht spricht`,`Der Hosenboden ist hin, der Stolz auch`,`Im Graben zählt ${N} jetzt Gänseblümchen`])}
  else if(sm.place===1&&patron){h=pick([`Patron weint! ${N} versohlt dem Boss den Hintern`,`${N} zieht dem Patron die Radhose runter`]);sub=`Der alte Boss schaut ${at} nur noch auf ${N}s Rückennummer`}
  else if(sm.place===1&&margin<1){h=`Um eine Schrittlänge! ${N} siegt mit der Hose voller Glück`;sub=`Fotofinish ${at} – ${m2.name} kocht vor Wut`}
  else if(sm.place===1&&kills>=2){h=`${N} gewinnt und verteilt Bidons wie Freibier`;sub=`Die Konkurrenz liegt ${at} reihenweise im Gebüsch`}
  else if(sm.place===1){h=pick([`${N} reitet alle in Grund und Boden!`,`WADEN-WAHNSINN! ${N} fährt allen davon`,`Hintern hoch, Kopf runter: ${N} gewinnt ${at}`,`${N} siegt – Konkurrenz heult in die Sitzcreme`]);sub=pick([`${N} ließ ${at} alle anderen alt aussehen`,`Die Gegner hatten nur ${N}s Hinterteil vor Augen`,`Champagner, Sitzcreme, Siegerkuss – ${N} hat alles`])}
  else if(kills>=3){h=`Bidon-Bombe ${N}! ${kills} Rivalen sitzen im Graben`;sub=`Am Ende reicht es trotzdem nur für Platz ${sm.place}`}
  else if(sm.place===res.length){h=pick([`Rote Laterne! ${N} fährt wie Opa nach dem Schweinebraten`,`${N} als Letzter – der Besenwagen hupt schon`]);sub=`${W} gewinnt ${at}, ${N} sucht noch den Ausgang`}
  else if(sm.place<=3){h=pick([`${N} aufs Treppchen – Champagner spritzt, Hosen kleben`,`Podium! ${N} darf die Hostess küssen`]);sub=`Platz ${sm.place} ${at}, ${W} holt den Sieg`}
  else{h=pick([`${W} siegt ${at} – ${N} irgendwo beim Bratwurststand`,`${W} gewinnt, ${N} gewinnt Sitzbeschwerden`]);sub=`${N} rollt als ${sm.place}. über den Strich`}
  const parts=[];
  if(win.isP&&!myW)parts.push(pick([`${N} widmete den Sieg der eigenen Sitzcreme.`,`${N} zeigte der Konkurrenz nach dem Ziel den blanken Hintern. Die Jury sah es nicht. Leider alle anderen.`,`${N} feierte im Ziel mit zwei Litern Weißbier und einem Wadenkrampf.`]));
  const g1=pick(Z_GOSSIP);let g2=pick(Z_GOSSIP);if(g2===g1)g2=Z_GOSSIP[(Z_GOSSIP.indexOf(g1)+3)%Z_GOSSIP.length];
  parts.push(zFill(g1,rivs));
  const km=leaderOf(race.wpts.kom),sp=leaderOf(race.wpts.spr);
  if(km)parts.push(`${km==='Du'?N:km} holte sich die Bergpunkte und danach ein Sauerstoffzelt.`);
  if(sp)parts.push(`Den Sprint gewann ${sp==='Du'?N:sp} – mit dem Hintern weit vorn.`);
  if(race.newRec.race||race.newRec.lap)parts.push(`Rekord! ${N} war so schnell, dass die Zuschauer ihre Toupets festhalten mussten.`);
  else if(race.rec&&!race.rec.rnP&&race.rec.race<race.rec0.race)parts.push(`${race.rec.rn} knackt den Streckenrekord. Die Konkurrenz vermutet Rückenwind aus der eigenen Hose.`);
  parts.push(zFill(g2,rivs));
  if(sm.thug&&!myW)parts.push(sm.thugDown?`Rudis Geldeintreiber landete selbst im Graben und weinte nach Mama.`:`Rudis Geldeintreiber klebte ${N} das ganze Rennen am Hinterrad wie ein Kaugummi am Schuh.`);
  if(sm.sp)parts.push(sm.spOk?`Sponsor ${sm.sp.n} spendiert eine Runde.`:`Sponsor ${sm.sp.n} hat schon schlechte Laune.`);

}

  show(`<article class="paper">
    <header class="mast"><span>Ausgabe Nr. ${raceNo}</span><b>Der Kettenblatt-Kurier</b><span>Preis 1,20 €</span></header>
    <h1 class="hl">${hl.h}</h1>

      <div class="story"><canvas class="face pic" data-face="${picFace(res)}"></canvas><p class="lede">${hl.body}</p>
        <blockquote class="pq">„${hl.quote.text}“<cite>${hl.quote.who}</cite></blockquote>
        <p class="side">In der Gesamtwertung führt ${lead.n==='Du'?pname():lead.n} mit ${lead.p} Punkten.</p></div>
      <aside><h3>Zieleinlauf</h3><table>${rows}</table>${wTable()}
        <h3>Streckenrekord</h3><p class="recl">${fmt(race.rec.race)} · ${race.rec.rn}${race.newRec.race?' <b class="neu">Neu!</b>':''}</p>
        <p class="recl">Runde ${fmt(race.rec.lap)} · ${race.rec.ln}${race.newRec.lap?' <b class="neu">Neu!</b>':''}</p></aside>
    </div>
  </article>
  <section class="card bill"><h2>Abrechnung</h2><div class="sum">
      <span>Preisgeld (Platz ${sm.place})</span><span data-count="${me.prize}">${eur(0)}</span>
      <span>Kopfgeld (${race.kills})</span><span data-count="${race.earn.bounty}">${eur(0)}</span>
      <span>Fundstücke</span><span data-count="${race.earn.pick}">${eur(0)}</span>
      ${sm.sp?`<span>Sponsor ${sm.sp.n}${sm.spOk?'':' – verfehlt'}</span><span data-count="${sm.spPay}">${eur(0)}</span>`:''}
      <span>Wertungen (${sm.wWins}× gewonnen)</span><span data-count="${sm.wPay}">${eur(0)}</span>

      <p class="ds">Verschleiß: ${WEAR.map(x=>`${x.n} ${S.wear[x.k]} %`).join(' · ')}</p>
      ${WEAR.some(x=>S.wear[x.k]>=75)?'<p class="warn">Einige Teile sind fast hinüber. Tausch sie in der Werkstatt, bevor sie dir im Rennen um die Ohren fliegen.</p>':''}
      <p class="xpline">+${sm.xp} Erfahrung${sm.lvlUp?` · <b>Stufe ${C.lvl}!</b> Du hast ${C.spts} Punkt${C.spts>1?'e':''} zu verteilen.`:''}</p>
      ${sm.newAch.length?`<div class="achnew">${sm.newAch.map(a=>`<div class="ach on"><b>${a.n}</b><span>${a.d}</span><em>${a.m?'+ '+eur(a.m):'Trikot „'+JERSEYS.find(j=>j.id===a.j).n+'“'}</em></div>`).join('')}</div>`:''}
      ${me.wrecked?'<p class="warn">Gestürzt heißt: kein Preisgeld, keine Punkte. Kopfgeld und Fundstücke behältst du.</p>':''}
      ${sm.interest?`<p class="warn">${SHARK} schlägt ${eur(sm.interest)} Zinsen drauf. Du schuldest ihm jetzt ${eur(S.debt)}.</p>`:''}
  </section>

}
function seasonEnd(){
  if(S.ended)return S.endSum;S.ended=true;
  const st=standings(),pos=st.findIndex(x=>x.n==='Du')+1,champ=st[0].n,newAch=[];
  const r0=S.rank0||myRank();
  for(const e of st)C.rp[e.n]=Math.round((C.rp[e.n]||0)*.5+e.p);
  if(pos===1)grant('cup',newAch);
  if(leaderOf(S.kom)==='Du')grant('berg',newAch);
  if(leaderOf(S.spr)==='Du')grant('sprintk',newAch);
  if(!S.crashes)grant('sauber',newAch);
  const r1=myRank();
  // Rivalen altern, treten ab, Talente rücken nach
  const retired=[],rookies=[];
  C.roster.forEach((r,i)=>{if(r.n==='Der Patron')return;r.age++;r.sk=clamp(r.sk+(r.age<25?.06:r.age<30?.02:r.age<33?0:-.05),.05,.95);
    if(r.age>=40||(r.age>=36&&rnd()<.5)){retired.push(r.n);delete C.rp[r.n];const t=talent();C.roster[i]=t;rookies.push(t);C.rp[t.n]=0}});
  applyRoster(C.roster);
  C.history.push({season:S.season||C.seasonNo,champ,pos});
  C.debt=S.debt>0?Math.round(S.debt*1.5):0;
  C.seasonNo++;
  const L=rankList();let duel=null;
  if(!C.patron&&L[0].n==='Du'){const pi=RIVALS.findIndex(r=>r.n==='Der Patron');duel=pi>=0?pi:RIVALS.findIndex(r=>r.n===L[1].n)}
  else if(C.patron){const top=L.find(e=>e.n!=='Du');duel=RIVALS.findIndex(r=>r.n===top.n)}
  C.pendingDuel=duel;
  saveCareer();try{localStorage.removeItem(SAVE)}catch(e){}
  return S.endSum={st,pos,champ,r0,r1,retired,rookies,newAch,duel};
}
function finalScreen(){
  const E=seasonEnd(),N=pname(),{st,pos,champ}=E;
  const C1=champ==='Du'?N:champ;
  const h=pos===1?pick([`${N} holt den Pott – und die Konkurrenz holt sich Sitzcreme`,`Cupsieger ${N}: Waden aus Stahl, Hintern aus Leder`]):pick([`${C1} holt den Kettenblatt-Cup`,`${C1} krönt sich – ${N} wird ${pos}.`]);
  const parts=[];
  parts.push(E.r1<E.r0?`${N} klettert in der Rangliste von Platz ${E.r0} auf ${E.r1}.`:E.r1>E.r0?`${N} rutscht in der Rangliste von Platz ${E.r0} auf ${E.r1}. Autsch.`:`${N} bleibt in der Rangliste auf Platz ${E.r1}.`);
  for(const n of E.retired)parts.push(`${n} ${pick(RETIRE_SNARK)}.`);
  for(const t of E.rookies)parts.push(`Neu im Feld: ${t.n}, ${t.age}, ${TYPES[t.t]}${t.t==='K'||t.t==='P'?'':''} – ${pick(TALENT_SNARK)}.`);
  if(E.newAch.length)parts.push(`Fürs Trophäenregal: ${E.newAch.map(a=>a.n).join(', ')}.`);
  const kd=leaderOf(S.kom),sd=leaderOf(S.spr);
  if(kd)parts.push(`Das gepunktete Trikot geht an ${kd==='Du'?N:kd}, das grüne an ${sd?(sd==='Du'?N:sd):'niemanden'}.`);
  const opp=E.duel!=null&&E.duel>=0?RIVALS[E.duel]:null;
  const duelTxt=opp?(C.patron?`<p class="warn">${opp.n} fordert dich heraus. Wer das Duell verliert, ist den Titel los.</p>`:`<p class="ok">Du stehst an der Spitze der Rangliste. ${opp.n} erwartet dich zum Duell um den Titel.</p>`):'';
  show(`<div class="title"><canvas class="hero" data-scene="podest" aria-label="Siegerpodest mit Feuerwerk"></canvas>
    <article class="paper" style="width:100%;max-width:46rem;text-align:left">
      <header class="mast"><span>Saisonrückblick</span><b>Der Kettenblatt-Kurier</b><span>Saison ${C.seasonNo-1}</span></header>
      <h1 class="hl">${h}</h1>
      <div class="cols"><div class="story"><p class="lede">${parts.join(' ')}</p></div><aside><h3>Endstand</h3>${standTable()}</aside></div>
    </article>
    ${C.debt>0?`<p class="warn">${SHARK} nimmt deine Schulden mit in die nächste Saison: ${eur(C.debt)}, sofort fällig.</p>`:''}
    ${duelTxt}
    <div class="row">${opp?`<button class="go" type="button" data-act="duel">Zum Duell</button>`:''}<button class="go ${opp?'alt':''}" type="button" data-act="new">${opp&&C.patron?'Duell absagen, Titel abgeben':'Nächste Saison'}</button></div></div>`,true);
  startDemo();
}
function startDuel(){
  const i=C.pendingDuel;if(i==null||i<0)return;
  if(!S)newSeason();
  S.hp=maxHp();
  startRace({d:2,th:pick([5,3,4,0]),riv:[i],duel:true});
}
function duelDone(res,me){
  const win=res[0].isP&&!me.wrecked,opp=res.find(r=>!r.isP).name,N=pname(),newAch=[];
  let h,sub;
  if(win){
    if(!C.patron){C.patron=true;grant('patron',newAch);
      const pi=C.roster.findIndex(r=>r.n==='Der Patron');if(pi>=0){delete C.rp['Der Patron'];const t=talent();C.roster[pi]=t;C.rp[t.n]=0;applyRoster(C.roster)}
      h=`${N} stürzt den Patron!`;sub='Der alte Boss hängt die Radhose an den Nagel. Es gibt einen neuen Patron.'}
    else{h=`Patron ${N} verteidigt den Titel`;sub=`${opp} schleicht mit eingezogenem Sattel davon.`}
    C.titles++;addMoney(2000);
  }else{
    if(C.patron){C.patron=false;h=`${opp} entthront ${N}!`;sub='Der Titel ist weg, die Würde auch.'}
    else{h=`Der Patron lacht ${N} aus`;sub='Nächstes Jahr vielleicht. Vielleicht auch nie.'}
  }
  C.pendingDuel=null;saveCareer();
  show(`<article class="paper"><header class="mast"><span>Sonderausgabe</span><b>Der Kettenblatt-Kurier</b><span>Duell</span></header>
    <h1 class="hl">${h}</h1><p class="sub">${sub}</p>
    ${win?`<p class="lede">Siegprämie: ${eur(2000)}. Titel insgesamt: ${C.titles}.</p>`:''}
    ${newAch.length?`<div class="achnew">${newAch.map(a=>`<div class="ach on"><b>${a.n}</b><span>${a.d}</span></div>`).join('')}</div>`:''}</article>
    <div class="row"><button class="go" type="button" data-act="new">Nächste Saison</button></div>`);
}
function startWeekly(){
  const w=weekInfo();WS_BACKUP=S;WEEKLY=true;
  S={money:0,race:4,bike:w.bike,spent:0,hp:0,ammo:30,tacks:3,gels:1,up:{rad:0,schalt:0,rahmen:0,reifen:0},points:{},grudge:{},debt:0,debtDue:99,sponsor:null,spOffers:[],kom:{},spr:{},name:C.name,offers:[]};
  S.hp=maxHp();startRace({d:1,th:w.th,riv:w.riv,weekly:true});
}
function weeklyDone(res,me){
  const w=weekInfo(),place=res.indexOf(me)+1,rec=C.weekly[w.key]||{};const newAch=[];
  const t=me.wrecked?null:me.time;
  if(t&&(!rec.best||t<rec.best))rec.best=t;if(!me.wrecked&&(!rec.place||place<rec.place))rec.place=place;C.weekly[w.key]=rec;
  S=WS_BACKUP;WS_BACKUP=null;WEEKLY=false;
  if(place===1&&!me.wrecked)grant('woche',newAch);
  saveCareer();
  show(`<header class="g-head"><h1>Herausforderung der Woche</h1><div class="g-stats"><span class="chip">KW ${w.wk}</span><span class="chip">${THEMES[w.th].name}</span><span class="chip">${BIKES[w.bike].n}</span></div></header>
    <div class="g-grid"><section class="card"><h2>Ergebnis</h2><p>${me.wrecked?'Gestürzt.':`Platz ${place} in ${fmt(t)}.`}</p><p class="ds">Deine Bestzeit diese Woche: ${rec.best?fmt(rec.best):'–'} · bester Platz: ${rec.place||'–'}</p>
    ${newAch.length?`<div class="achnew">${newAch.map(a=>`<div class="ach on"><b>${a.n}</b><span>${a.d}</span><em>+ ${eur(a.m)}</em></div>`).join('')}</div>`:''}</section>
    <section class="card"><h2>Zieleinlauf</h2><table>${res.map((r,i)=>`<tr class="${r.isP?'me':''}"><td class="rk">${i+1}</td><td>${r.isP?pname():r.name}</td><td>${r.wrecked?'Sturz':fmt(r.time)}</td></tr>`).join('')}</table></section></div>
    <div class="row"><button class="go alt" type="button" data-act="quit">Hauptmenü</button><button class="go" type="button" data-act="weekly">Nochmal</button></div>`);
}
function backupCode(){const o={c:C,s:localStorage.getItem(SAVE),r:getRecs()};return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function backupScreen(){
  let code='';try{code=backupCode()}catch(e){code='Fehler beim Erzeugen'}
  show(`<header class="g-head"><h1>Spielstand</h1></header><div class="g-grid">
    <section class="card"><h2>Sichern</h2><p class="ds">Kopier diesen Code und heb ihn irgendwo auf, zum Beispiel in einer Notiz. Damit holst du deine Karriere auf jedes Gerät zurück.</p>
      <textarea id="bk-out" class="code" readonly>${code}</textarea><button class="go" type="button" data-act="copy">Code kopieren</button><p class="ds" id="bk-msg"></p></section>
    <section class="card"><h2>Laden</h2><p class="ds">Füg einen gesicherten Code ein. Achtung: Das ersetzt deine aktuelle Karriere auf diesem Gerät.</p>
      <textarea id="bk-in" class="code" placeholder="Code hier einfügen"></textarea><button class="go alt" type="button" data-act="restore">Code laden</button><p class="ds" id="bk-err"></p></section></div>
    <div class="row"><button class="go alt" type="button" data-act="quit">Zurück</button></div>`);
}
const STAY=new Set(['fix','up','sup','spon','loan','repay','stat','mate','cos','wear','wearall']);
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(STAY.has(a)){keepView={y:overlay.scrollTop,act:a,k:b.dataset.k,i:b.dataset.i,am:b.dataset.a};setTimeout(()=>{keepView=null},0)}
  if(a==='new'){const nm=document.getElementById('pname');if(nm)C.name=nm.value.trim().slice(0,18);if(C.pendingDuel!=null&&C.patron){C.patron=false}C.pendingDuel=null;saveCareer();newSeason();garage()}
  else if(a==='duel')startDuel();
  else if(a==='weekly')startWeekly();
  else if(a==='backup')backupScreen();
  else if(a==='reset'){if(b.dataset.sure){try{localStorage.removeItem(SAVE);localStorage.removeItem(CAREER)}catch(e){}S=null;initCareer();titleScreen()}else{b.dataset.sure=1;b.textContent='Wirklich alles löschen? Nochmal tippen.'}}
  else if(a==='copy'){const t=document.getElementById('bk-out'),m=document.getElementById('bk-msg');const ok=()=>{m.textContent='Kopiert.'},no=()=>{t.focus();t.select();m.textContent='Markiert. Jetzt mit „Kopieren“ übernehmen.'};try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}}
  else if(a==='restore'){const v=document.getElementById('bk-in').value.trim(),er=document.getElementById('bk-err');try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.c||o.c.v!==1)throw 0;localStorage.setItem(CAREER,JSON.stringify(o.c));if(o.s)localStorage.setItem(SAVE,o.s);else localStorage.removeItem(SAVE);if(o.r)localStorage.setItem(REC_KEY,JSON.stringify(o.r));S=null;initCareer();titleScreen()}catch(e){er.textContent='Der Code passt nicht. Prüf, ob er vollständig kopiert ist.'}}
  else if(a==='stat'){const k=b.dataset.k;if(C.spts>0&&C.stats[k]<10){C.spts--;C.stats[k]++;if(k==='aus')S.hp+=4;saveCareer();garage();sfx(500,1000,.15,'triangle',.05)}}
  else if(a==='wear'){const x=WEAR.find(w=>w.k===b.dataset.k),c=wearCost(x);if(S.money>=c&&S.wear[x.k]>0){S.money-=c;S.wear[x.k]=0;save();garage();sfx(500,900,.15,'triangle',.04)}}
  else if(a==='wearall'){let t=0;for(const x of WEAR)if(S.wear[x.k]>0)t+=wearCost(x);if(S.money>=t){S.money-=t;S.wear=WEAR0();save();garage();sfx(500,1100,.25,'triangle',.05)}}
  else if(a==='mate'){C.mate=!C.mate;saveCareer();garage();sfx(400,700,.12,'triangle',.04)}
  else if(a==='cos'){C.cos=b.dataset.k;saveCareer();garage()}
  else if(a==='cont'){S=load();const nm=document.getElementById('pname')?.value.trim().slice(0,18);if(nm!=null){S.name=nm;save()}garage()}
  else if(a==='quit'){race=null;titleScreen()}
  else if(a==='garage')garage();
  else if(a==='shop')shop();
  else if(a==='final')finalScreen();
  else if(a==='lineup')lineup(+b.dataset.i);
  else if(a==='race'&&pendingOffer){const o=pendingOffer;pendingOffer=null;startRace(o)}
  else if(a==='spon'){const i=+b.dataset.i;S.sponsor=S.sponsor===i?null:i;save();garage();sfx(600,900,.12,'triangle',.04)}
  else if(a==='loan'){const amt=+b.dataset.a;if(S.debt===0&&S.race<=LOAN_LAST){S.money+=amt;S.debt=Math.round(amt*LOAN_RATE);S.debtDue=S.race+LOAN_RACES-1;save();garage();sfx(300,200,.3,'sawtooth',.04)}}
  else if(a==='repay'){if(S.money>=S.debt){if(!overdue())grant('ehrenmann',null);S.money-=S.debt;S.debt=0;S.debtDue=0;S.carried=0;save();garage();sfx(500,1000,.25,'triangle',.05)}}
  else if(a==='fix'){const miss=maxHp()-S.hp,n=Math.min(miss,Math.floor(S.money/3));S.hp+=n;S.money-=n*3;save();garage();sfx(500,800,.15,'triangle',.04)}
  else if(a==='up'){const u=UPG.find(x=>x.k===b.dataset.k),lv=S.up[u.k],c=u.cost[lv];if(lv<u.cost.length&&S.money>=c){S.money-=c;S.spent+=c;S.up[u.k]++;if(u.k==='rahmen')S.hp+=20;save();garage();sfx(400,900,.2,'square',.04)}}
  else if(a==='sup'){const s=SUP.find(x=>x.k===b.dataset.k);if(S.money>=s.cost&&S[s.k]<s.max){S.money-=s.cost;S[s.k]=Math.min(s.max,S[s.k]+s.per);save();garage();sfx(700,1000,.1,'triangle',.04)}}
  else if(a==='buybike'){const i=+b.dataset.i,net=Math.max(0,BIKES[i].price-tradeIn());if(S.money>=net&&bikeOpen(BIKES[i])){S.money-=net;S.bike=i;S.spent=0;S.up={rad:0,schalt:0,rahmen:0,reifen:0};S.wear=WEAR0();S.hp=maxHp();save();sfx(400,1200,.35,'triangle',.06);garage()}}
});

/* ---------- Eingabe ---------- */
const K={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'b',KeyS:'b',Space:'f'};
addEventListener('keydown',e=>{
  if(state==='menu')return;
  if(e.code==='KeyX'){e.preventDefault();if(state==='race')dropTack(player);return}
  if(e.code==='KeyC'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(state==='race'&&!e.repeat)useGel(player);return}
  const k=K[e.code];if(!k)return;e.preventDefault();keys[k]=true;
});
addEventListener('keyup',e=>{const k=K[e.code];if(k)keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function bindBtn(id,k,tap){
  const b=document.getElementById(id);
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){ }b.classList.add('on');if(tap){if(state==='race')tap()}else keys[k]=true};
  const off=()=>{if(!tap)keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
/* Lenkfeld: ein Finger reicht für beide Richtungen. Wer vom Knopf rutscht, lenkt weiter, bis er loslässt. */
(()=>{
  const zone=document.querySelector('.grp.steer'),bl=document.getElementById('bl'),br=document.getElementById('br');
  let pid=null;
  const set=x=>{const r=zone.getBoundingClientRect(),right=x>r.left+r.width/2;keys.r=right;keys.l=!right;br.classList.toggle('on',right);bl.classList.toggle('on',!right)};
  const end=e=>{if(e.pointerId!==pid)return;pid=null;keys.l=keys.r=false;bl.classList.remove('on');br.classList.remove('on')};
  zone.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{zone.setPointerCapture(pid)}catch(_){ }set(e.clientX)});
  zone.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e.clientX)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>zone.addEventListener(t,end));
  zone.addEventListener('contextmenu',e=>e.preventDefault());
})();
bindBtn('bf','f');
bindBtn('bt',null,()=>dropTack(player));bindBtn('bg',null,()=>useGel(player));

let AC=null;
function sfx(f1,f2,d,type,vol){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}
}

initCareer();titleScreen();requestAnimationFrame(frame);
