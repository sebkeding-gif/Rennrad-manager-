<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14191C">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Rennrad Manager – führe ein Radsportteam durch sechs Saisons. Kostenlos im Browser, auch offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rennrad">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:title" content="Rennrad Manager">
<meta property="og:description" content="Führe ein Radsportteam durch sechs Saisons – Rennen live steuern, Trikots jagen, Intrigen spinnen.">
<meta property="og:image" content="icon-512.png">
<title>Rennrad Manager</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: Roadbook mit Rennbanner. Dunkles Kopfband wie der Zielbogen, Karten wie Seiten im Roadbook, Startnummern als Erkennungszeichen, Zeitabstände auf der Schiefertafel des Rennmotorrads, Trikots für die Wertungen. */
:root{
  --paper:#ECEEE8; --card:#FFFFFF; --ink:#151A1D; --muted:#5A6468; --line:#DDE1DA; --wash:#F1F3EE;
  --band:#14191C; --bandInk:#F4F2EA; --bandMuted:#9AA39F; --bandLine:#2A3236;
  --marker:#F2B705; --markerInk:#1B1505; --team:#2356A8; --teamSoft:#E3EAF6;
  --g1:#CFD5CB; --g2:#F2B705; --g3:#DD5B1E; --g4:#951F25;
  --good:#23824B; --bad:#B42318; --shade:#2A2320; --shadeInk:#F3E9DC; --shadeMuted:#C9BCAB; --shadeLine:#4A3F38;
  --shadow:0 1px 2px rgba(20,25,28,.06),0 8px 24px rgba(20,25,28,.07);
  --sky1:#D7E4EC; --sky2:#FFFFFF;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --chalk:"Cabin Sketch","Saira Condensed",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1113; --card:#171C20; --ink:#E8EBE6; --muted:#9AA3A6; --line:#283036; --wash:#1E2429;
  --band:#090C0E; --bandInk:#F1EFE7; --bandMuted:#8C9591; --bandLine:#20272B;
  --marker:#F2B705; --markerInk:#1B1505; --team:#86ACEF; --teamSoft:#1D2839;
  --g1:#353E3A; --g2:#C99212; --g3:#DB6A33; --g4:#D9474D;
  --good:#5BC489; --bad:#F2706B; --shade:#0B0908; --shadeInk:#EADFCF; --shadeMuted:#A99C8B; --shadeLine:#2E2621;
  --shadow:0 1px 2px rgba(0,0,0,.5); --sky1:#1A262E; --sky2:#171C20; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1113; --card:#171C20; --ink:#E8EBE6; --muted:#9AA3A6; --line:#283036; --wash:#1E2429;
  --band:#090C0E; --bandInk:#F1EFE7; --bandMuted:#8C9591; --bandLine:#20272B;
  --marker:#F2B705; --markerInk:#1B1505; --team:#86ACEF; --teamSoft:#1D2839;
  --g1:#353E3A; --g2:#C99212; --g3:#DB6A33; --g4:#D9474D;
  --good:#5BC489; --bad:#F2706B; --shade:#0B0908; --shadeInk:#EADFCF; --shadeMuted:#A99C8B; --shadeLine:#2E2621;
  --shadow:0 1px 2px rgba(0,0,0,.5); --sky1:#1A262E; --sky2:#171C20; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}

/* Kopfband */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding-inline:16px;background:var(--band);color:var(--bandInk);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top::after{content:"";display:block;height:4px;margin-inline:-16px;background:repeating-linear-gradient(90deg,var(--marker) 0 14px,var(--band) 14px 28px)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.brand{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.02em;text-transform:uppercase;line-height:1;font-style:italic}
.brand span{color:var(--marker);margin-left:6px}
.setbtn{background:none;border:1px solid var(--bandLine);color:var(--bandInk);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.setbtn[aria-pressed="true"]{background:var(--marker);color:var(--markerInk);border-color:var(--marker)}
.teamline{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:600;font-size:14px;color:var(--bandMuted);min-width:0}
.teamline .tdot{width:10px;height:10px;border-radius:2px;background:var(--team);flex:none}
.teamname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.stat{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.06);border-radius:6px;padding:5px 8px;min-width:0}
.stat small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--bandMuted)}
.stat b{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 8px 8px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--bandMuted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--bandInk);border-bottom-color:var(--marker)}

main{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.card{background:var(--card);border-radius:12px;padding:18px 16px;min-width:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.shade{background:var(--shade);color:var(--shadeInk);border-color:var(--shade)}
.card.shade .muted,.card.shade .hint{color:var(--shadeMuted)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card.shade .eyebrow{color:var(--marker)}
h2{font-family:var(--display);font-weight:800;font-size:36px;line-height:.95;margin:4px 0 8px;text-wrap:balance;text-transform:uppercase;letter-spacing:.005em}
h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
h4{font-weight:700;font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero>div{min-width:0}
.heronum{font-family:var(--display);font-weight:800;font-style:italic;font-size:64px;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--marker);flex:none}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:13px;margin-bottom:12px;align-items:center}
.badge{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px;background:var(--marker);color:var(--markerInk);vertical-align:middle;font-style:italic}
.hint{font-size:14px;color:var(--muted);margin-top:8px;max-width:65ch}

.profile{width:100%;height:180px;display:block;border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

.bib{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;padding:0 4px;margin-right:7px;border-radius:3px;background:#FFFFFF;color:#111111;border:1px solid #B9BEB6;font-family:var(--mono);font-size:11.5px;font-weight:600;vertical-align:1px;box-shadow:inset 0 0 0 2px #FFFFFF,inset 0 0 0 3px #E9ECE6}
.jersey{display:inline-block;vertical-align:-3px;margin-left:5px;flex:none}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted)}
.row.off .who{opacity:.55}
.chk{width:22px;height:22px;accent-color:var(--team);flex:none}
select{background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;max-width:100%}
.pill{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--g3);border-color:var(--g3)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.gold{background:var(--marker);color:var(--markerInk);border-color:var(--marker)}
.fit{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.fit i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.fit i.on{background:var(--team)}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--wash)}
.seg button{flex:1;background:none;border:0;padding:9px 6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%;font-size:13px}
.seg.jer button{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px}
.tacdesc{font-size:13px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 20px;font-family:var(--display);font-weight:800;font-style:italic;font-size:19px;letter-spacing:.05em;text-transform:uppercase;background:var(--marker);color:var(--markerInk);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:none;border:1px solid var(--line);color:inherit;font-size:16px;padding:9px 14px;box-shadow:none;font-style:normal}
.btn.small{font-size:15px;padding:7px 12px}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad);font-size:15px;padding:7px 12px;box-shadow:none;font-style:normal}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.warnline{font-size:13px;color:var(--bad);margin-top:8px}
.flash{border-left:3px solid var(--marker);padding:8px 12px;background:var(--wash);color:var(--ink);border-radius:0 6px 6px 0;font-size:14px}

.eqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.eqgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}

/* Trikotträger */
.leaders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.leader{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--wash);min-width:0}
.leader.mine{background:var(--teamSoft);outline:2px solid var(--team)}
.leader .lt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leader .ln{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .lv{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader>div{min-width:0}

/* Live */
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-family:var(--mono);font-size:12.5px;cursor:pointer}
.ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kmbig{font-family:var(--display);font-weight:800;font-style:italic;font-size:44px;line-height:1}
.kmbig small{font-size:16px;color:var(--muted);font-weight:700;margin-left:4px;font-style:normal}
.livenews{border-left:4px solid var(--marker);padding:9px 11px;margin:6px 0 12px;background:var(--wash);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:4px;font-size:14px;min-height:42px}
.livenews div{display:grid;grid-template-columns:52px 1fr;gap:6px}
.livenews div:first-child{font-weight:700}
.livenews .k{font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:1px}
.livenews .me{color:var(--team)}
.ardoise{background:#26332D;color:#F1EFE6;border-radius:12px;padding:12px 14px 14px;border:6px solid #6E5137;box-shadow:var(--shadow)}
.ardhead{font-family:var(--chalk);font-size:20px;letter-spacing:.03em;opacity:.9}
.ardoise .grp{border-top:1px dashed rgba(241,239,230,.25);padding-top:8px}
.ardoise .grp:first-child{border-top:0;padding-top:0}
.ardoise .gl{color:#F1EFE6}
.ardoise .gl b{font-family:var(--chalk);font-size:19px;letter-spacing:.02em;text-transform:none}
.ardoise .gap{font-family:var(--chalk);font-size:18px;color:#F6D776}
.ardoise .chip{background:rgba(255,255,255,.1);color:#F1EFE6;border-left-color:#A9C4F5}
.ardoise .chip small{color:#C9D3CC}
.ardoise .muted{color:#B9C4BD}
.ardsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#C9D3CC;margin:12px 0 6px;padding-top:10px;border-top:1px dashed rgba(241,239,230,.3)}
.ardhead+.ardsub{border-top:0;padding-top:0;margin-top:6px}
.ardlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.ardlog li{display:grid;grid-template-columns:54px 1fr;gap:6px;opacity:.78}
.ardlog li:first-child{opacity:1}
#lnews li:first-child .t{font-weight:700;font-size:15px}
.ardlog .k{font-family:var(--chalk);font-size:16px;color:#F6D776;line-height:1.2}
.ardlog li.me .t,.ardlog li.funk .t{color:#A9C4F5}
.ardlog li.me .t{font-weight:600}
.ardmore{margin-top:8px;font-size:13px}
.ardmore summary{cursor:pointer;color:#C9D3CC;font-family:var(--mono);font-size:12px}
.ardmore[open] .ardlog{margin-top:8px;max-height:280px;overflow:auto}
.radio{border:2px solid var(--marker);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--card);box-shadow:var(--shadow)}
.radio .rt{font-weight:600}
.orders{display:flex;flex-direction:column;gap:10px}
.order{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.order:first-child{border-top:0;padding-top:0}
.order .od{font-size:12.5px;color:var(--muted)}
.order>button{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.order>button:disabled{background:none;color:var(--muted);border-color:var(--line);cursor:not-allowed}
.order>button[aria-pressed="true"]{background:var(--marker);color:var(--markerInk);border-color:var(--marker)}
.attackers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.attackers button{border:1px solid var(--team);background:var(--teamSoft);color:var(--ink);border-radius:6px;padding:6px 9px;font-size:13px;cursor:pointer}
.attackers button:disabled{opacity:.45;cursor:not-allowed}
.groups{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.grp{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;font-size:14px}
.grp .gl{font-family:var(--mono);font-size:12.5px}
.grp .gl b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{font-size:12.5px;padding:2px 7px;border-radius:4px;background:var(--teamSoft);color:var(--ink);border-left:3px solid var(--team);display:inline-flex;align-items:center}
.chip.cap{font-weight:700}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:5px}
.ticker{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ticker li{display:grid;grid-template-columns:58px 1fr;gap:8px}
.ticker .k{font-family:var(--mono);color:var(--muted);font-size:12.5px;padding-top:1px}
.ticker li.me .t{font-weight:600}
.ticker li.funk .t{color:var(--team)}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-top:14px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.pod .pn{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .pt{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .block{width:100%;border-radius:8px 8px 0 0;background:var(--wash);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;color:var(--muted)}
.pod.p1 .block{height:86px;background:var(--marker);color:var(--markerInk)}
.pod.p2 .block{height:62px}
.pod.p3 .block{height:44px}
.pod.mine .pn{color:var(--team)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:2px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.me td{background:var(--teamSoft)}
tr.lead td{font-weight:700}
.pos{font-family:var(--display);font-weight:800;font-style:italic;font-size:18px;width:34px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

.rcard{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.rcard:first-child{border-top:0;padding-top:0}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rhead .nm{font-weight:700;font-size:16px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bar{font-size:11px;color:var(--muted);font-family:var(--mono)}
.bar .track{height:6px;background:var(--wash);border-radius:3px;margin-top:3px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--team),color-mix(in srgb,var(--team) 70%,var(--marker)))}
.bar .fill.range{opacity:.6}
.bar b{color:var(--ink);font-weight:600}
.rfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.why{font-size:12.5px;color:var(--team)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.summary div{border-left:3px solid var(--marker);padding-left:10px}
.summary b{display:block;font-family:var(--display);font-size:26px;font-weight:800;font-style:italic;line-height:1.1}
.summary span{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;font-size:14px;color:var(--muted);max-width:65ch}
.field{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.field input,.field textarea{flex:1 1 200px;min-width:0;background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.field textarea{font-family:var(--mono);font-size:12px;height:90px;resize:vertical}
.setrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .lbl{font-weight:600}
.checkline{display:flex;gap:10px;align-items:center}

.eqitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

function buildCourse(def,season){
  const R=seeded(def.name+'#'+season);const n=def.km;const g=Array.from({length:n},()=>(R()*1.2-0.6)*(def.type==='flach'||def.type==='zf'?0.6:1.2));

  def.climbs.forEach((c,ci)=>{
    for(let k=c.at;k<Math.min(n,c.at+c.len);k++){g[k]=Math.max(1.8,c.g+(R()*2-1));climb[k]=c.at+c.len-k;if(ci===def.climbs.length-1)last[k]=true}

    for(let k=c.at+c.len;k<Math.min(n,c.at+c.len+dl);k++){if(next&&k>=next.at)break;g[k]=-(5+R()*2)}
  });
  def.cob.forEach(([a,l])=>{for(let k=a;k<Math.min(n,a+l);k++)cob[k]=true});
  const segs=[];let el=60+R()*80,hm=0;

function gradeColor(g){return g>=9?css('--g4'):g>=6?css('--g3'):g>=3?css('--g2'):css('--g1')}
function drawProfile(cv,course,frame,Rmap,sprintKm){
  const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const segs=course.segs,n=course.total;let mn=Infinity,mx=-Infinity;segs.forEach(s=>{mn=Math.min(mn,s.e0,s.e1);mx=Math.max(mx,s.e0,s.e1)});
  mx=Math.max(mx,mn+250);const top=24,bot=H-20,padL=4,padR=4;
  const X=k=>padL+(W-padL-padR)*k/n,Y=e=>bot-(bot-top)*(e-mn+20)/(mx-mn+40);
  const ink=css('--ink'),muted=css('--muted'),line=css('--line'),card=css('--card'),mono=css('--mono');
  const sky=c.createLinearGradient(0,0,0,bot);sky.addColorStop(0,css('--sky1'));sky.addColorStop(1,css('--sky2'));c.fillStyle=sky;c.fillRect(0,0,W,bot);
  segs.forEach((s,i)=>{c.beginPath();c.moveTo(X(i),bot);c.lineTo(X(i),Y(s.e0));c.lineTo(X(i+1),Y(s.e1));c.lineTo(X(i+1),bot);c.closePath();c.fillStyle=gradeColor(s.grade);c.fill()});
  if(frame){c.fillStyle=card;c.globalAlpha=0.45;c.fillRect(X(frame.km),top-10,W-X(frame.km),bot-top+10);c.globalAlpha=1}
  c.beginPath();segs.forEach((s,i)=>{if(i===0)c.moveTo(X(0),Y(s.e0));c.lineTo(X(i+1),Y(s.e1))});c.strokeStyle=ink;c.lineWidth=1.5;c.stroke();
  c.fillStyle=ink;segs.forEach((s,i)=>{if(s.cob){for(let k=0;k<3;k++)c.fillRect(X(i)+k*(X(1)-X(0))/3,bot+3,Math.max(1.5,(X(1)-X(0))/4),3)}});
  c.strokeStyle=line;c.lineWidth=1;c.beginPath();c.moveTo(X(0),bot+.5);c.lineTo(X(n),bot+.5);c.stroke();
  c.fillStyle=muted;c.font=`11px ${mono}`;c.textBaseline='top';
  const step=n>120?40:n>60?20:5;for(let k=0;k<=n;k+=step){const x=X(k);c.fillRect(x,bot,1,4);c.textAlign=k===0?'left':'center';if((n-k>step*0.4&&X(n)-x>44)||k===0)c.fillText(k,x,bot+8)}
  c.textAlign='right';c.fillText(n+' km',X(n),bot+8);
  c.textBaseline='bottom';c.font=`600 11px ${mono}`;
  const cats={};climbList(course).forEach(x=>cats[x.km]=x.cat);
  const used=[];if(sprintKm>0&&sprintKm<n)used.push([X(sprintKm)-2,X(sprintKm)+14,top+9],[X(sprintKm)-2,X(sprintKm)+14,top+20]);const free=(x0,x1,y)=>!used.some(u=>x0<u[1]+4&&x1>u[0]-4&&Math.abs(y-u[2])<13);
  const sums=[];segs.forEach((s,i)=>{if(s.climbRem===1)sums.push({i,s,cat:cats[i+1]})});
  const rankC=k=>({HC:0,'1':1,'2':2,'3':3,'4':4}[k]??5);
  sums.slice().sort((a,b)=>rankC(a.cat)-rankC(b.cat)||b.s.e1-a.s.e1).forEach(({i,s,cat})=>{const xr=X(i+1),y=Y(s.e1);
    if(cat&&cat!=='4'){c.fillStyle='#D7262E';c.beginPath();c.arc(xr,y-3,2.6,0,Math.PI*2);c.fill()}
    const opts=[(cat?(cat==='HC'?'HC':cat+'. Kat')+' · ':'')+Math.round(s.e1)+' m',cat?(cat==='HC'?'HC':cat+'.'):''].filter(Boolean);
    for(const lbl of opts){const w=c.measureText(lbl).width;const x=clamp(xr,w/2+4,W-w/2-18);
      for(const ly of [y-8,y-21]){if(ly<12)continue;if(free(x-w/2,x+w/2,ly)){c.fillStyle=ink;c.textAlign='center';c.fillText(lbl,x,ly);used.push([x-w/2,x+w/2,ly]);return}}}});
  if(sprintKm>0&&sprintKm<n){const x=X(sprintKm);c.strokeStyle='#1E9E4A';c.lineWidth=1.5;c.setLineDash([3,3]);c.beginPath();c.moveTo(x,bot);c.lineTo(x,top);c.stroke();c.setLineDash([]);
    c.fillStyle='#1E9E4A';c.fillRect(x,top,12,9);c.fillStyle='#FFFFFF';c.font=`700 8px ${mono}`;c.textAlign='center';c.textBaseline='middle';c.fillText('S',x+6,top+4.6);c.textBaseline='bottom';c.font=`600 11px ${mono}`}
  c.strokeStyle=ink;c.lineWidth=2;c.beginPath();c.moveTo(X(n)-1,Y(segs[n-1].e1));c.lineTo(X(n)-1,top-8);c.stroke();
  for(let k=0;k<3;k++)for(let j=0;j<2;j++){c.fillStyle=(k+j)%2?ink:card;c.fillRect(X(n)-13+k*4,top-8+j*4,4,4)}
  if(!frame||!frame.g.length)return;
  const lead=frame.g[0],lk=frame.km;
  frame.g.forEach((g,gi)=>{const gap=g.t-lead.t;const km=clamp(lk-gap*11/1000,0,n);const si=Math.min(n-1,Math.floor(km));const s=segs[si];const e=s.e0+(s.e1-s.e0)*(km-si);

      c.font=`700 11px ${mono}`;c.textAlign='center';c.textBaseline='bottom';c.fillText(mine.length,x,y-rad*2-15)}
  });
}

function showFinale(cb){
  const L=G.last,race=CAL[L.idx],res=L.res;if(!res.length){cb();return}
  const kind=res[1]&&res[1].gap>=5?'solo':race.finish;

  const v=race.finish==='mountain'?5.6:race.finish==='hill'?9:16.5;
  // Auswahl: Spitze plus eigene Fahrer
  const sel=res.map((o,i)=>({o,i})).filter(x=>x.i<24||(x.o.team==='me'&&x.o.gap<=45)).slice(0,34);
  let prevGap=-9,k=0;
  const riders=sel.map(({o,i})=>{if(o.gap-prevGap<1)k++;else k=0;prevGap=o.gap;const r=R(G,o.id)||{name:'?',id:'r0'};
    const tie=k*(v>12?0.12:0.25);
    return {id:o.id,pos:i+1,name:r.name,last:r.name.split(' ').slice(-1)[0],bib:String(r.id).replace(/\D/g,''),team:o.team,col:(c=>c&&c.startsWith('var(')?css(c.slice(4,-1)):(c||'#888'))(teamOf(o.team).color),me:o.team==='me',
      ft:o.gap+tie,lane:0,jit:(Math.random()*2-1),off:(o.gap<1?(Math.random()*24-15):0),done:false}});
  // Spuren verteilen, eigene Fahrer gut sichtbar
  riders.forEach((r,i)=>r.lane=r.me?1+(i%3):(i*5+3)%7);
  const D=1000,showM=v>12?320:v>8?260:200,W=showM/v;
  const lastFt=Math.max(...riders.map(r=>r.ft));const myMax=Math.max(0,...riders.filter(r=>r.me).map(r=>r.ft));const endTau=W+Math.max(Math.min(lastFt,6),myMax)+1.2;
  const ov=document.createElement('div');ov.className='finale';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Zielsequenz');
  ov.innerHTML=`<div class="fbox"><div class="fhead"><div><div class="fsub">${esc(race.name)} · letzte ${showM} m</div><div class="ftitle">${TITLE}</div></div><button class="fbtn" id="fskip">Überspringen</button></div><canvas id="fcv"></canvas><div class="fcap" id="fcap" aria-live="polite"><span class="muted">Die letzten Meter …</span></div></div>`;
  document.body.appendChild(ov);
  const cv=ov.querySelector('#fcv'),cap=ov.querySelector('#fcap'),btn=ov.querySelector('#fskip');
  let raf2=0,closed=false;const finished=[];

const fmtGapShort=(m,v)=>'+'+Math.max(1,Math.round(m/v))+' s';

  const nav=`<div class="seg jer subnav wrap" role="group" aria-label="Wertung">${subs.map(([k,l])=>`<button data-act="wsub" data-v="${k}" aria-pressed="${wsub===k}">${k==='rank'?'':jersey(k,15)}${l}</button>`).join('')}</div>`;
  const nr=G.cls?G.cls.races:0;const head=`<div class="eyebrow">Saison ${G.season} · nach ${G.results.length} Rennen</div>`;
  const who=(id,extra='')=>{const r=R(G,id);return `<td><div style="font-weight:600">${bib(r)}${esc(r.name)}${jer(id)}${extra}</div><div class="muted" style="font-size:12.5px">${r.team?`<span class="dot" style="background:${teamOf(r.team).color}"></span>${esc(tName(r.team))}`:'vereinslos'}</div></td>`};
  const cut=(arr,n)=>{const top=arr.slice(0,n).map((x,i)=>({x,i}));const mine=arr.map((x,i)=>({x,i})).filter(o=>o.i>=n&&(R(G,o.x.id)||{}).team==='me');return top.concat(mine)};
  const empty='<p class="muted">Nach dem ersten Rennen steht hier der Zwischenstand.</p>';
  let body='';
  if(wsub==='gc'){const t=gcTable(G);const t0=t[0]?t[0].t:0;
    body=`<section class="card">${head}<h2>Gesamtwertung</h2><p class="hint" style="margin-top:0">Alle Rückstände aus den Rennen werden addiert. Die ersten drei eines Rennens bekommen 10, 6 und 4 Sekunden Bonus. Wer ein Rennen auslässt, erhält 15 Minuten Strafe, wer aufgibt, 20 Minuten. Bei gleicher Zeit entscheidet die Summe der Platzierungen. Der Führende trägt das Gelbe Trikot.</p>
    ${t.length?`<div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Fahrer</th><th class="r">Rückstand</th><th class="r">Starts</th></tr></thead><tbody>${cut(t,20).map(({x,i})=>`<tr class="${(R(G,x.id)||{}).team==='me'?'me':''} ${i===0?'lead':''}"><td class="pos">${i+1}</td>${who(x.id)}<td class="r num">${i===0?'führt':'+'+fmtT(x.t-t0)}</td><td class="r num">${x.starts}/${nr}</td></tr>`).join('')}</tbody></table></div>`:empty}</section>`}
  else if(wsub==='pts'||wsub==='kom'){const t=ptsTable(G,wsub);
    body=`<section class="card">${head}<h2>${wsub==='pts'?'Punktewertung':'Bergwertung'}</h2><p class="hint" style="margin-top:0">${wsub==='pts'?'Punkte gibt es im Ziel und beim Zwischensprint. Flache Rennen bringen im Ziel die meisten Punkte, der Sieger bekommt 50. Der Führende trägt das Grüne Trikot.':'Punkte gibt es auf jeder Bergwertung, gestaffelt von der 4. Kategorie bis HC. Endet ein Rennen am Berg, zählt die Wertung im Ziel doppelt. Der Führende trägt das Gepunktete Trikot.'}</p>
    ${t.length?`<div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Fahrer</th><th class="r">Punkte</th></tr></thead><tbody>${cut(t,20).map(({x,i})=>`<tr class="${(R(G,x.id)||{}).team==='me'?'me':''} ${i===0?'lead':''}"><td class="pos">${i+1}</td>${who(x.id)}<td class="r num">${x.p}</td></tr>`).join('')}</tbody></table></div>`:empty}</section>`}
  else if(wsub==='team'){const t=teamTable(G);const t0=t[0]?t[0].t:0;
    body=`<section class="card">${head}<h2>Teamwertung</h2><p class="hint" style="margin-top:0">Pro Rennen zählen die Rückstände der drei besten Fahrer jedes Teams. Das führende Team fährt mit gelben Startnummern.</p>
    ${nr?`<div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Team</th><th class="r">Rückstand</th></tr></thead><tbody>${t.map((x,i)=>`<tr class="${x.id==='me'?'me':''} ${i===0?'lead':''}"><td class="pos">${i+1}</td><td><span class="dot" style="background:${teamOf(x.id).color}"></span>${esc(tName(x.id))}${i===0?jersey('team'):''}</td><td class="r num">${i===0?'führt':'+'+fmtT(x.t-t0)}</td></tr>`).join('')}</tbody></table></div>`:empty}</section>`}
  else{const ts=G.teams.map(t=>({t,p:G.teamPts[t.id]||0})).sort((a,b)=>b.p-a.p);
    const rs=G.riders.filter(r=>r.team!==null&&r.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,12);
    body=`<section class="card">${head}<h2>Rangliste</h2><p class="hint" style="margin-top:0">Weltranglistenpunkte aus allen Rennen. Danach richten sich Sponsorprämie und Saisonplatz. Stärke ist der Schnitt der sechs besten Fahrer, daneben die Veränderung seit Saisonstart. Auch die anderen Teams trainieren, kaufen ein und rüsten nach erfolgreichen Jahren auf.</p>
    <div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Team</th><th class="r">Stärke</th><th class="r">Punkte</th></tr></thead><tbody>
    ${ts.map((x,i)=>{const st=teamStrength(G,x.t.id),d=x.t.str0!=null?st-x.t.str0:0;return `<tr class="${x.t.id==='me'?'me':''}"><td class="pos">${i+1}</td><td><span class="dot" style="background:${x.t.color}"></span>${esc(tName(x.t.id))}</td><td class="r num">${st}${d?` <span class="ovrd ${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>`:''}</td><td class="r num">${x.p}</td></tr>`}).join('')}
    </tbody></table></div></section>
    <section class="card"><h3>Fahrer</h3>${rs.length?`<div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Fahrer</th><th class="r">Punkte</th></tr></thead><tbody>
    ${rs.map((r,i)=>`<tr class="${r.team==='me'?'me':''}"><td class="pos">${i+1}</td>${who(r.id,r.banned?' <span class="pill bad">gesperrt</span>':'')}<td class="r num">${r.pts}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted">Nach dem ersten Rennen stehen hier die punktbesten Fahrer.</p>'}</section>
    <section class="card"><h3>Rennkalender</h3><div class="tablewrap"><table><thead><tr><th>Nr.</th><th>Rennen</th><th>Sieger</th><th class="r">Dein Bester</th></tr></thead><tbody>
    ${CAL.map((c,i)=>{const r=G.results.find(x=>x.idx===i);return `<tr class="${r&&r.winTeam==='me'?'me':''}"><td class="num">${i+1}</td><td><div style="font-weight:600">${esc(c.name)}</div><div class="muted" style="font-size:12.5px">${TYPE_LABEL[c.type]} · ${c.km} km</div></td><td>${r?esc(r.winnerName):'<span class="muted">offen</span>'}</td><td class="r num">${r?(r.best?r.best.pos+'.':'–'):''}</td></tr>`}).join('')}
    </tbody></table></div></section>`}
  view.innerHTML=nav+body;
}

function renderSettings(){
  view.innerHTML=`<section class="card"><div class="eyebrow">Einstellungen</div><h2>Spiel</h2>
    <div class="setrow"><label class="lbl" for="tname">Teamname</label><div class="field"><input id="tname" maxlength="32" value="${esc(G.teamName)}"><button class="btn ghost small" data-act="rename">Speichern</button></div></div>
    <div class="setrow"><span class="lbl">Renntempo</span><span class="muted" style="font-size:13px">Wie schnell das Rennen live abläuft. Bei Normal dauert ein Straßenrennen ohne Pausen etwa eine Minute.</span>
      <div class="seg" role="group" aria-label="Renntempo">${Object.keys(SPEEDS).map(k=>`<button data-act="setspeed" data-v="${k}" aria-pressed="${G.settings.speed===k}">${SPEED_LABEL[k]}</button>`).join('')}</div></div>
    <div class="setrow"><label class="checkline"><input type="checkbox" class="chk" data-act="setpause" ${G.settings.pauses?'checked':''}><span><span class="lbl">Rennfunk-Pausen</span><br><span class="muted" style="font-size:13px">Das Rennen hält bei Ausreißern, Anstiegen im Finale, Problemen deines Kapitäns und Zwischenzeiten an.</span></span></label></div>
    <div class="setrow"><label class="checkline"><input type="checkbox" class="chk" data-act="setfinale" ${G.settings.finale!==false?'checked':''}><span><span class="lbl">Zielsequenzen</span><br><span class="muted" style="font-size:13px">Zeigt das Finale als kurze Szene, wenn deine Fahrer vorn mitfahren.</span></span></label></div>
    <div class="setrow"><label class="checkline"><input type="checkbox" class="chk" data-act="eqauto" ${G.equip.auto?'checked':''}><span><span class="lbl">Material automatisch wählen</span><br><span class="muted" style="font-size:13px">Vor jedem Rennen das beste vorhandene Material für die Strecke.</span></span></label></div>
  </section>
  <section class="card"><h3>Spielstand</h3>
    <p class="hint" style="margin-top:0">Der Spielstand liegt nur in diesem Browser. Zum Umziehen auf ein anderes Gerät kopierst du ihn hier und fügst ihn dort ein.</p>
    <div class="actions" style="margin-top:10px"><button class="btn ghost small" data-act="export">Spielstand kopieren</button></div>
    <div class="field" id="exportbox" hidden><textarea id="exporttxt" readonly aria-label="Spielstand zum Kopieren"></textarea></div>
    <div class="setrow" style="margin-top:12px"><label class="lbl" for="importtxt">Spielstand einfügen</label><div class="field"><textarea id="importtxt" placeholder="Kopierten Spielstand hier einfügen"></textarea></div><div><button class="btn ghost small" data-act="import">Laden</button></div>
    ${G.flash&&G.flash.tab==='einstellungen'?`<p class="flash">${esc(G.flash.txt)}</p>`:''}</div>
  </section>
  <section class="card"><h3>Datenschutz</h3>
    <details style="margin-top:10px"><summary>Datenschutzhinweise</summary>
      <p>Verantwortlich ist der Betreiber dieser Seite. Das Spiel setzt keine Cookies, zählt keine Nutzung und bindet keine Dienste Dritter ein.</p>
      <p><b>Spielstand.</b> Der Spielstand wird nur auf deinem Gerät im Browserspeicher abgelegt und nicht übertragen. Löschen kannst du ihn über „Neues Spiel starten“ oder die Browserdaten.</p>

      <p><b>Schriften.</b> Alle Schriften liegen auf dieser Seite selbst. Es werden keine Daten an Google übertragen.</p>
      <p><b>Deine Rechte.</b> Du hast die Rechte aus Art. 15 bis 21 DSGVO und kannst dich bei einer Datenschutzaufsichtsbehörde beschweren (Art. 77 DSGVO).</p>
    </details>
  </section>
  <section class="card"><h3>Neues Spiel</h3>
    <div class="setrow"><span class="lbl">Schwierigkeit</span><span class="muted" style="font-size:13px">Gilt für das nächste neue Spiel. Bestimmt die Stärke der anderen Teams.</span>
      <div class="seg" role="group" aria-label="Schwierigkeit">${['leicht','normal','schwer'].map(k=>`<button data-act="setdiff" data-v="${k}" aria-pressed="${G.settings.difficulty===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
    <div class="actions">${confirmKey==='reset'?`<span style="font-size:14px">Spielstand wirklich löschen?</span><button class="btn danger" data-act="resetok">Ja, neu beginnen</button><button class="btn ghost small" data-act="cancel">Nein</button>`:`<button class="btn danger" data-act="reset">Neues Spiel starten</button>`}</div>

function flash(t,txt){G.flash={tab:t,txt}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;confirmKey=null;if(G.flash&&G.flash.tab!==tab)G.flash=null;render();window.scrollTo(0,0);if(G.phase==='live'&&tab==='rennen')loop();return}
  const a=b.dataset.act,id=b.dataset.id;
  if(['sel','eqauto','setpause','setfinale','innoon'].includes(a))return;
  if(a==='tactic'){G.lineup.tactic=b.dataset.v;save();render()}
  else if(a==='suggest'){G.lineup=suggestLineup(G);G.equip.auto=true;G.equip.sel=pickEquip(G.equip.owned,curRace(G));save();render()}
  else if(a==='start'){startLive()}
  else if(a==='spd'){G.live.speed=b.dataset.v;document.querySelectorAll('[data-act="spd"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===b.dataset.v?'true':'false'))}
  else if(a==='hold'){G.live.hold=!G.live.hold;updateLive()}
  else if(a==='resume'){G.live.pause=null;G.live.hold=false;updateLive()}
  else if(a==='skip'){cancelAnimationFrame(raf);skipToEnd()}
  else if(a==='order'){giveOrder(G.live,b.dataset.k,b.dataset.arg);save();updateLive()}
  else if(a==='next'){afterRace(G);trainWhy={};save();tab='rennen';render();window.scrollTo(0,0)}
  else if(a==='newseason'){newSeason(G);save();render();window.scrollTo(0,0)}
  else if(a==='trainsuggest'){trainWhy=suggestTraining(G);save();render()}
  else if(a==='sell'){confirmKey='sell-'+id;render()}
  else if(a==='sellok'){const r=R(G,id);G.budget+=value(r)*0.85;r.team=null;G.market.push(r.id);if(G.lineup)G.lineup.ids=G.lineup.ids.filter(x=>x!==id);fixRoles(G);confirmKey=null;save();render()}
  else if(a==='cancel'){confirmKey=null;render()}
  else if(a==='buy'){const r=R(G,id);const p=value(r);if(G.budget<p||myRiders(G).length>=10)return;G.budget-=p;r.team='me';r.train='grundlage';G.market=G.market.filter(x=>x!==id);G.lineup=null;flash('markt',`${r.name} fährt ab sofort für dich.`);save();render()}
  else if(a==='poach'){const msg=doPoach(G,id);if(msg)flash('markt',msg);save();render()}
  else if(a==='cross'){const msg=signCross(G,id);if(msg)flash('markt',msg);save();render();window.scrollTo(0,0)}
  else if(a==='sub'){sub=b.dataset.v;render()}
  else if(a==='wsub'){wsub=b.dataset.v;render()}
  else if(a==='rolesok'){G.rolesAsk=false;G.lineup=suggestLineup(G);save();render()}
  else if(a==='replay'){showFinale(()=>{})}
  else if(a==='infrabuy'){const k=b.dataset.k,lv=G.infra[k]+1,L=INFRA[k].levels[lv];if(!L||G.budget<L.price)return;G.budget-=L.price;G.infra[k]=lv;save();render()}
  else if(a==='labbuild'){const L=LAB_LEVELS[G.lab.level+1];if(!L||G.budget<L.price)return;G.budget-=L.price;G.lab.level++;save();render()}
  else if(a==='labfocus'){G.lab.focus=b.dataset.v;save();render()}
  else if(a==='newgame'){const keep=G.settings;cancelAnimationFrame(raf);G=newGame(keep.difficulty);G.settings=keep;trainWhy={};save();tab='rennen';render();window.scrollTo(0,0)}
  else if(a==='eqbuy'){const it=EQUIP[b.dataset.cat].items[b.dataset.k];if(G.budget<it.price)return;G.budget-=it.price;G.equip.owned[b.dataset.cat].push(b.dataset.k);if(G.equip.auto)G.equip.sel=pickEquip(G.equip.owned,curRace(G));save();render()}
  else if(a==='eqpick'){G.equip.sel[b.dataset.cat]=b.dataset.k;G.equip.auto=false;save();render()}
  else if(a==='intr'){const msg=doIntrigue(G,b.dataset.k,G.intrTarget||G.teams.find(t=>t.ai).id);if(msg)flash('intrigen',msg);save();render()}
  else if(a==='rename'){const v=document.getElementById('tname').value.trim();if(v){G.teamName=v;G.teams[0].name=v;save();render()}}
  else if(a==='setspeed'){G.settings.speed=b.dataset.v;save();render()}
  else if(a==='setdiff'){G.settings.difficulty=b.dataset.v;save();render()}
  else if(a==='export'){const txt=JSON.stringify(G);const box=document.getElementById('exportbox'),ta=document.getElementById('exporttxt');ta.value=txt;box.hidden=false;
    const sel=()=>{ta.focus();ta.select()};try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Kopiert'},sel)}catch(err){sel()}}
  else if(a==='import'){try{const x=JSON.parse(document.getElementById('importtxt').value);if(!x||!(x.v===2||x.v===3||x.v===4)||!Array.isArray(x.riders))throw 0;cancelAnimationFrame(raf);G=migrate(x);if(G.phase==='live'&&G.live)G.live.hold=true;flash('einstellungen','Spielstand geladen.');save();render()}catch(err){flash('einstellungen','Das ist kein gültiger Spielstand. Kopiere ihn vollständig über „Spielstand kopieren“.');render()}}
  else if(a==='reset'){confirmKey='reset';render()}
  else if(a==='resetok'){confirmKey=null;const keep=G.settings;cancelAnimationFrame(raf);G=newGame(keep.difficulty);G.settings=keep;trainWhy={};save();tab='rennen';render()}
  else if(a==='tab'){tab=b.dataset.v;render();window.scrollTo(0,0)}
});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset.act,id=t.dataset.id;if(!a)return;
  if(a==='sel'){const L=G.lineup;if(t.checked){if(!L.ids.includes(id))L.ids.push(id);if(!L.roles[id])L.roles[id]='helfer'}else{L.ids=L.ids.filter(x=>x!==id)}save();render()}
  else if(a==='role'){const L=G.lineup;if(t.value==='kapitaen')L.ids.forEach(x=>{if(L.roles[x]==='kapitaen')L.roles[x]='helfer'});L.roles[id]=t.value;save();render()}
  else if(a==='train'){R(G,id).train=t.value;delete trainWhy[id];save()}
  else if(a==='eqsel'){G.equip.sel[t.dataset.cat]=t.value;G.equip.auto=false;save();render()}
  else if(a==='eqauto'){G.equip.auto=t.checked;if(t.checked)G.equip.sel=pickEquip(G.equip.owned,curRace(G));save();render()}
  else if(a==='setpause'){G.settings.pauses=t.checked;save()}
  else if(a==='setcap'||a==='setvice'){G.roles=G.roles||{};G.roles[a==='setcap'?'cap':'vice']=t.value||null;const TR=teamRoles(G);G.roles={cap:TR.cap,vice:TR.vice};if(G.phase==='plan')G.lineup=suggestLineup(G);save();render()}
  else if(a==='setfinale'){G.settings.finale=t.checked;save()}
  else if(a==='itarget'){G.intrTarget=t.value;save()}
  else if(a==='innoon'){const x=G.lab.items.find(i=>i.k===t.dataset.k);if(x){x.on=t.checked;save();render()}}
});
let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(G.phase==='live'&&tab==='rennen'){liveSig={};updateLive()}else if(tab==='rennen'&&G.phase==='plan'){const c=document.getElementById('prof');if(c){const cr=courseFor(G,G.raceIdx);drawProfile(c,cr,null,null,curRace(G).finish==='tt'?-1:Math.round(cr.total*0.55))}}},120)});
const rerender=()=>{if(G.phase==='live'&&tab==='rennen'){liveSig={};updateLive()}else render()};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',rerender);
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function start(data){
  G=migrate((data&&data.G)||load()||newGame());
  if(G.phase==='live'&&G.live)G.live.hold=true;
  save();render();if(G.phase==='live')loop();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
